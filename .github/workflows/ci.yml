name: CI

on:
  push:
    branches:
      - main
  pull_request:

# Cancel in-progress runs for the same PR / ref (PRs only).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libclang-dev pkg-config libssl-dev

      - name: Install Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add clippy

      - uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libclang-dev pkg-config libssl-dev

      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Run unit tests
        run: cargo test --workspace

  # The GPU code never compiles in the jobs above, since `gpu` is off by default.
  # CUDA stubs let it type-check on a runner with no CUDA toolkit and no GPU.
  gpu-check:
    name: GPU feature check
    runs-on: ubuntu-latest
    env:
      ZKSYNC_USE_CUDA_STUBS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libclang-dev pkg-config libssl-dev

      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Type-check the GPU path
        run: >
          cargo check -p zksync_os_fri_prover -p zksync_os_snark_prover
          --features zksync_os_fri_prover/gpu,zksync_os_snark_prover/gpu

  # Single required status check for branch protection.
  ci-success:
    name: CI Status Check
    runs-on: ubuntu-latest
    if: always() && !cancelled()
    needs: [fmt, clippy, test, gpu-check]
    steps:
      - name: Verify all jobs passed
        run: |
          if [[ "${{ contains(join(needs.*.result, ','), 'failure') }}" == "true" ]]; then
            echo "One or more required jobs failed"
            exit 1
          fi
          echo "All required jobs passed"
